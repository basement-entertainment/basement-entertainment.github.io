<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL Bypass with JavaScript</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  iframe {
    flex-grow: 1;
    width: 100%;
    border: none;
  }
  textarea {
    width: 100%;
    height: 100px;
  }
  #output {
    width: 100%;
    height: 100px;
    background: #f4f4f4;
    border: 1px solid #ccc;
    overflow: auto;
    padding: 5px;
  }
</style>
</head>
<body>

<input id="url" type="text" placeholder="Enter URL">
<button onclick="loadURL()">Load URL</button>
<button onclick="executeScript()">Run JavaScript</button>
<button onclick="toggleFullScreen()">Toggle Fullscreen</button>
<textarea id="jsCode" placeholder="Enter JavaScript code"></textarea>
<div id="output"></div>
<iframe id="iframe"></iframe>

<script>
function loadURL() {
  var iframe = document.getElementById("iframe");
  var url = document.getElementById("url").value;
  iframe.setAttribute("src", url);
}

function executeScript() {
  var jsCode = document.getElementById("jsCode").value;
  var outputDiv = document.getElementById("output");
  
  try {
    var result = eval(jsCode); // Execute JavaScript in the parent document
    outputDiv.innerText = "Output: " + result;
  } catch (e) {
    outputDiv.innerText = "Error: " + e.message;
  }
}

function toggleFullScreen() {
  var iframe = document.getElementById("iframe");
  
  if (!document.fullscreenElement) {
    iframe.requestFullscreen().catch(err => {
      alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
    });
  } else {
    document.exitFullscreen();
  }
}
</script>

</body>
</html>
